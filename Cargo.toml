[package]
name = "mova"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2.0.19"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.5.2"
dashmap = "6.2.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[[bin]]
name = "mova-lsp"
path = "src/bin/lsp.rs"
